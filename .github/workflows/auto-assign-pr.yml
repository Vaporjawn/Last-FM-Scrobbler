name: Auto-assign PR

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      # No PR-supplied content is read or interpolated here — this only ever adds a
      # fixed, hardcoded assignee, regardless of who opened the PR or what it contains.
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: ["Vaporjawn"],
            });
