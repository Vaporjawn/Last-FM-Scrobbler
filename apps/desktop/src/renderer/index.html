<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.freetls.fastly.net https://*.dzcdn.net"
    />
    <!--
      img-src explicitly allows Last.fm's real image CDN (confirmed live via curl
      against the actual API — user avatars, and real album/track art too; artist
      *photos* specifically are the one exception — see docs/modules/core.md's "Known
      limitation: artist images" for why those never differ from a Last.fm-side
      placeholder in practice, and where real artist photos actually come from
      instead) plus Deezer's image CDN (`*.dzcdn.net` — see `packages/core`'s
      `fetchArtistImageUrl`, the real source for artist photos throughout this app) —
      without either, `default-src 'self'` silently blocks every one of those images
      at the browser level with a CSP violation in the console, which is exactly what
      happened here the first time: the whole data/IPC/render pipeline worked
      correctly end to end, real image URLs reached a real <img src>, and the browser
      blocked the request anyway.

      Both hosts are wildcarded to a subdomain (`https://*.freetls.fastly.net`,
      `https://*.dzcdn.net`) rather than pinned to one exact hostname
      (`lastfm.freetls.fastly.net`, `cdn-images.dzcdn.net`): both `imageUrl`/
      `avatarUrl` (Last.fm) and `picture_xl`/`picture_big`/`picture_medium` (Deezer)
      come straight from each provider's own live API response, not from a URL this
      app constructs — so the exact subdomain is whatever that provider's CDN happens
      to hand back, and it can differ per response/endpoint. Confirmed live: Last.fm
      has served images from both `lastfm.freetls.fastly.net` (the case this policy
      originally covered) and `lastfm-img.freetls.fastly.net` (which broke a
      hostname-pinned policy the same way, with the same "everything passed tests but
      images were silently blocked" symptom); Deezer has been seen using both
      `cdn-images.dzcdn.net` and `e-cdn-images.dzcdn.net`. Pinning to one observed
      hostname reintroduces this exact bug the next time either provider's CDN
      responds from a different subdomain of the same service. `data:` covers any
      inline/base64 image content (icons, etc.).
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last.fm Scrobbler</title>
    <meta
      name="description"
      content="A native, cross-platform Last.fm scrobbler for macOS, Windows, and Linux — reads now playing directly from your OS's media session, no per-player plugins required."
    />
    <meta name="application-name" content="Last.fm Scrobbler" />

    <!-- `theme.ts`'s `createAppTheme(mode)` supports both "light" and "dark" now (see
    `AppSettings.themeMode`, toggled by Settings → General's "Dark mode" switch) — so
    this app has two themes, not one, and these can no longer be static. The `content`
    values below are just the pre-script default (dark, this app's original look) —
    `/theme-init.js`, loaded just after them, overwrites both to match the user's real
    persisted setting before anything paints. `color-scheme` makes Chromium's own UI
    (scrollbars, native form controls, the default canvas painted before any CSS loads)
    match instead of light-then-flipped (or vice versa); `theme-color` is the matching
    signal for anything else that reads it (e.g. a future `BrowserWindow` titlebar
    overlay color). -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0c0b" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Sets `<html>`'s `data-theme` attribute (which the `<style>` block below keys
    off of) from the real persisted theme *before* that `<style>` block — and
    therefore before anything paints. Plain, parser-blocking, same-origin external
    script rather than an inline one: this page's CSP (`script-src 'self'`, above) has
    no `'unsafe-inline'`/nonce, so an inline `<script>` here would simply be blocked.
    See `renderer/public/theme-init.js` for the rest of this story (where
    `window.initialThemeMode` comes from, why it's already defined by the time this
    runs). Without this, a light-mode user saw a dark flash on every launch — before
    React ever mounted and swapped in the real MUI theme. -->
    <script src="/theme-init.js"></script>

    <style>
      /* Inline and synchronous on purpose: paints before styles.css or any bundled CSS
      is fetched/parsed, closing the brief flash-of-white-canvas Chromium otherwise
      shows between window-open and MUI's CssBaseline taking over. Keyed off `<html>`'s
      `data-theme` attribute (set by `/theme-init.js`, just above, before this
      `<style>` block is even reached — see that script's own comment) rather than a
      single fixed color, now that this app has two themes. `#0f0c0b`/`#faf8f5` are
      `theme/index.ts`'s own real `DARK_BACKGROUND.default`/`LIGHT_BACKGROUND.default`
      — not MUI's generic `#121212` default this used to hardcode — so this seam stays
      invisible in both modes. `:not([data-theme="light"])`, rather than a plain
      `[data-theme="dark"]`, is what covers the brief instant before `/theme-init.js`
      actually runs: falling back to dark matches this app's original, dark-only look. */
      html,
      body {
        margin: 0;
      }

      html:not([data-theme="light"]),
      html:not([data-theme="light"]) body {
        background: #0f0c0b;
        color-scheme: dark;
      }

      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #faf8f5;
        color-scheme: light;
      }

      /* Shown only until React mounts and replaces #root's contents (see main.tsx) —
      never removed manually, so there's no risk of it lingering. Pure CSS, no image
      dependency, so it can never itself fail to load. */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      /* rgba(255,255,255,0.12)/rgba(0,0,0,0.12) — the same proportional ring contrast
      against each background. `border-top-color` (Last.fm's own red) stays the same
      brand color in both modes, same as `theme/index.ts`'s own `palette.primary.main`. */
      #root:empty::after {
        content: "";
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #d51007;
        animation: app-loading-spin 0.8s linear infinite;
      }

      html[data-theme="light"] #root:empty::after {
        border-color: rgba(0, 0, 0, 0.12);
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
