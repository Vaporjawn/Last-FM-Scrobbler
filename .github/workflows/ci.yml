name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so a rapid string of pushes doesn't queue
# up redundant matrix jobs and burn CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        pm: [pnpm, npm, bun]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # adapter-linux's MPRIS2 smoke test spawns its own throwaway D-Bus session bus
      # and skips itself if dbus-daemon isn't found — this just makes sure it's found,
      # rather than silently degrading to unit-tests-only on the one OS that matters
      # most for that adapter. ubuntu-latest images usually already have it; installed
      # defensively rather than assumed.
      - if: matrix.os == 'ubuntu-latest'
        name: Ensure dbus-daemon is available (adapter-linux MPRIS2 smoke test)
        run: command -v dbus-daemon || (sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus)

      # No explicit `version:` here on purpose — pnpm/action-setup reads it from
      # package.json's own `packageManager` field (pnpm@11.18.0) automatically.
      # Specifying both used to be silently tolerated; a newer pnpm/action-setup now
      # treats it as an ambiguous conflict and hard-errors ("Multiple versions of pnpm
      # specified") rather than picking one, which is what actually broke CI here.
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      # pnpm@11.18.0 (this repo's pinned packageManager) hard-requires Node >=22.13 —
      # it reads its own local package store via the built-in `node:sqlite` module,
      # which doesn't exist at all on Node 20 ("Error [ERR_UNKNOWN_BUILTIN_MODULE]: No
      # such built-in module: node:sqlite", verified live in a failed run). Several
      # other deps (jsdom, better-sqlite3, electron) also declare engines requiring
      # >=22 — this had been silently tolerated as an `EBADENGINE` warning rather than
      # a hard failure until pnpm's own startup check turned it into one.
      - if: matrix.pm != 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ matrix.pm == 'pnpm' && 'pnpm' || 'npm' }}

      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-node only caches npm/pnpm; bun's global install cache needs its own step.
      - if: matrix.pm == 'bun'
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\bun\install\cache' || '~/.bun/install/cache' }}
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies (pnpm)
        if: matrix.pm == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (npm)
        if: matrix.pm == 'npm'
        run: npm ci

      - name: Install dependencies (bun)
        if: matrix.pm == 'bun'
        run: bun install --frozen-lockfile

      # Build first: adapter-* packages' typecheck resolves
      # @lastfm-scrobbler/shared-types via its declared "types" field
      # (dist/index.d.ts), which only exists once that package is built.
      # scripts/run-workspaces.mjs builds packages in dependency order, so this
      # single build step produces every cross-package .d.ts before typecheck
      # needs it — same reasoning applies regardless of which pm is running it.
      - name: Build
        run: ${{ matrix.pm }} run build

      - name: Typecheck
        run: ${{ matrix.pm }} run typecheck

      - name: Lint
        run: ${{ matrix.pm }} run lint

      - name: Test
        run: ${{ matrix.pm }} run test
