packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
# Lets a plain semver specifier (e.g. "0.0.0") resolve to the local workspace package,
# the same way npm and Bun already do — required so internal dependencies can use one
# specifier syntax across all three package managers instead of pnpm-only "workspace:*".
linkWorkspacePackages: true
allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260801.1"
  - "@types/better-sqlite3@9.6.0"
