<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://lastfm.freetls.fastly.net https://cdn-images.dzcdn.net"
    />
    <!--
      img-src explicitly allows Last.fm's real image CDN (confirmed live via curl
      against the actual API — user avatars, and real album/track art too; artist
      *photos* specifically are the one exception — see docs/modules/core.md's "Known
      limitation: artist images" for why those never differ from a Last.fm-side
      placeholder in practice, and where real artist photos actually come from
      instead) plus Deezer's image CDN (`cdn-images.dzcdn.net`, confirmed live the
      same way — see `packages/core`'s `fetchArtistImageUrl`, the real source for
      artist photos throughout this app) — without either, `default-src 'self'`
      silently blocks every one of those images at the browser level with a CSP
      violation in the console, which is exactly what happened here the first time:
      the whole data/IPC/render pipeline worked correctly end to end, real image URLs
      reached a real <img src>, and the browser blocked the request anyway. `data:`
      covers any inline/base64 image content (icons, etc.).
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last.fm Scrobbler</title>
    <meta
      name="description"
      content="A native, cross-platform Last.fm scrobbler for macOS, Windows, and Linux — reads now playing directly from your OS's media session, no per-player plugins required."
    />
    <meta name="application-name" content="Last.fm Scrobbler" />

    <!-- `theme.ts` hardcodes MUI's dark palette (mode: "dark", no light variant) — this
    app has exactly one theme, so these can be static rather than media-query-driven.
    `color-scheme` makes Chromium's own UI (scrollbars, native form controls, the
    default white canvas painted before any CSS loads) dark by default instead of
    light-then-flipped; `theme-color` is the matching signal for anything else that
    reads it (e.g. a future `BrowserWindow` titlebar overlay color). -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <style>
      /* Inline and synchronous on purpose: paints before styles.css or any bundled CSS
      is fetched/parsed, closing the brief flash-of-white-canvas Chromium otherwise
      shows between window-open and MUI's CssBaseline taking over — #121212 is MUI's
      own default dark `palette.background.default`, so this seam is invisible. */
      html,
      body {
        margin: 0;
        background: #121212;
        color-scheme: dark;
      }

      /* Shown only until React mounts and replaces #root's contents (see main.tsx) —
      never removed manually, so there's no risk of it lingering. Pure CSS, no image
      dependency, so it can never itself fail to load. */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #root:empty::after {
        content: "";
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #d51007;
        animation: app-loading-spin 0.8s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
