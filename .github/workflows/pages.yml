name: Deploy Pages

# Source lives at apps/site/ — a sibling of apps/desktop, not part of it. Kept as a
# small hand-written static HTML/CSS pair (no framework, no build step, no
# package.json) deliberately — it's a landing page, not an app; see
# docs/modules/site.md.
on:
  push:
    branches: [main]
    paths: [apps/site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload apps/site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
